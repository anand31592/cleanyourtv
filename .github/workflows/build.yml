name: Build Apple TV Launcher

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 34 & Build APK
        working-directory: ./launcher
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --console=plain

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleTV-Launcher-APK
          path: |
            launcher/app/build/outputs/apk/debug/*.apk
            launcher/app/build/outputs/apk/release/*.apk
